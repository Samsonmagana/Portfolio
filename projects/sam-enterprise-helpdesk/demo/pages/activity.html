
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Activity Log | Sam Enterprise</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            color: #1e293b;
        }

        .topbar {
            background: #14213d;
            color: white;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .brand {
            font-size: 21px;
            font-weight: bold;
        }

        .topbar a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .topbar a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1400px;
            margin: 35px auto;
            padding: 0 25px;
        }

        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .page-heading h1 {
            font-size: 27px;
            margin-bottom: 8px;
        }

        .page-heading p {
            color: #64748b;
            font-size: 14px;
        }

        .summary-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 22px;
            margin-bottom: 25px;
            max-width: 300px;
        }

        .summary-card span {
            color: #64748b;
            font-size: 13px;
        }

        .summary-card h2 {
            font-size: 30px;
            margin-top: 10px;
            color: #14213d;
        }

        .toolbar {
            background: white;
            padding: 18px;
            border: 1px solid #e2e8f0;
            border-radius: 10px 10px 0 0;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        input, select {
            padding: 11px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input {
            flex: 1;
            min-width: 220px;
        }

        select {
            min-width: 180px;
            background: white;
        }

        input:focus, select:focus {
            border-color: #2563eb;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #1d4ed8;
        }

        .table-wrapper {
            background: white;
            border: 1px solid #e2e8f0;
            border-top: none;
            border-radius: 0 0 10px 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            font-size: 13px;
        }

        th {
            background: #f8fafc;
            color: #475569;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .4px;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .action-badge {
            display: inline-block;
            padding: 6px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            background: #e2e8f0;
            color: #334155;
            white-space: nowrap;
        }

        .created {
            background: #dcfce7;
            color: #166534;
        }

        .assigned {
            background: #dbeafe;
            color: #1e40af;
        }

        .returned {
            background: #fef3c7;
            color: #92400e;
        }

        .updated {
            background: #ede9fe;
            color: #5b21b6;
        }

        .details {
            color: #64748b;
            max-width: 250px;
            line-height: 1.5;
        }

        .status-message {
            padding: 35px;
            text-align: center;
            color: #64748b;
        }

        .footer {
            text-align: center;
            padding: 30px;
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 0 14px;
                margin-top: 22px;
            }

            .page-heading h1 {
                font-size: 23px;
            }

            .toolbar {
                flex-direction: column;
            }

            input, select {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="brand">SAM ENTERPRISE</div>
        <a href="assets.html">â† Back to Asset Management</a>
    </header>

    <main class="container">

        <section class="page-heading">
            <div>
                <h1>Asset Activity Log</h1>
                <p>Monitor and review activities performed on company assets.</p>
            </div>

            <button type="button" id="refreshActivity">
                â†» Refresh
            </button>
        </section>

        <section class="summary-card">
            <span>Total Recorded Activities</span>
            <h2 id="activityCount">0</h2>
        </section>

        <section class="toolbar">
            <input
                type="search"
                id="activitySearch"
                placeholder="Search assets, users or activities..."
            >

            <select id="actionFilter">
                <option value="All">All Activities</option>
                <option value="ASSET_CREATED">Asset Created</option>
                <option value="ASSET_UPDATED">Asset Updated</option>
                <option value="ASSET_ASSIGNED">Asset Assigned</option>
                <option value="ASSET_RETURNED">Asset Returned</option>
                <option value="MAINTENANCE_CREATED">Maintenance Created</option>
                <option value="MAINTENANCE_UPDATED">Maintenance Updated</option>
            </select>
        </section>

        <section class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>Asset</th>
                        <th>Activity</th>
                        <th>Performed By</th>
                        <th>Details</th>
                    </tr>
                </thead>

                <tbody id="activityTableBody">
                    <tr>
                        <td colspan="5" class="status-message">
                            Loading activity records...
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

        <footer class="footer">
            Sam Enterprise IT Department &copy; 2026
        </footer>

    </main>

    <script src="../js/demo-engine.js"></script>
<script src="../js/auth.js"></script>
    <script src="../js/activity.js"></script>

</body>
</html>
